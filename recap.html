    function initRecaps() {
        const select = document.getElementById("history-week-select");
        const weeks = Object.keys(RECAP_DATA).sort((a,b) => {
            let numA = parseInt(a.replace('Week_', '')) || 0;
            let numB = parseInt(b.replace('Week_', '')) || 0;
            return numB - numA;
        });

        weeks.forEach(w => {
            let opt = document.createElement("option");
            opt.value = w;
            opt.textContent = w.replace('_', ' ');
            select.appendChild(opt);
        });

        if (weeks.length > 0) {
            renderRecapView();
        } else {
            document.getElementById("recap-content-area").innerHTML = "<div class='game-pane-card' style='text-align:center; padding:50px;'><h2 style='color:var(--muted);'>No games have gone final yet. Check back after the first final whistle!</h2></div>";
            document.getElementById("accuracy-stats").innerHTML = "0-0 (0%)";
        }
    }

    function renderRecapView() {
        const week = document.getElementById("history-week-select").value;
        const games = RECAP_DATA[week] || [];
        const content = document.getElementById("recap-content-area");
        const statsSpan = document.getElementById("accuracy-stats");

        let correctPicks = 0;
        let totalCompleted = games.length;
        let html = "";

        games.forEach(item => {
            const pg = item.pre_game;
            const ap = item.autopsy;
            const ai_ap = ap.analysis || {};
            
            const grade = ai_ap.grade || "N/A";
            const isCorrect = ai_ap.winner_correct;
            if (isCorrect) correctPicks++;
            
            const correctTag = isCorrect ? "✅ Pick Hit" : "❌ Pick Missed";

            const awayAbbr = (pg.away && pg.away.abbr) ? pg.away.abbr : (pg.away_abbr || "AWY");
            const homeAbbr = (pg.home && pg.home.abbr) ? pg.home.abbr : (pg.home_abbr || "HOM");
            const awayName = (pg.away && pg.away.name) ? pg.away.name : (pg.away_name || "Away");
            const homeName = (pg.home && pg.home.name) ? pg.home.name : (pg.home_name || "Home");
            const awayLogo = (pg.away && pg.away.logo) ? pg.away.logo : (pg.away_logo || "");
            const homeLogo = (pg.home && pg.home.logo) ? pg.home.logo : (pg.home_logo || "");
            const estAway = pg.est_away_pts || 0;
            const estHome = pg.est_home_pts || 0;
            const conf = pg.confidence || 6;
            const mLine = pg.market_line || "N/A";
            
            let ai_insights = pg.ai_insights || {};
            let pWinner = ai_insights.predicted_winner || "N/A";
            let preAnalysis = ai_insights.analysis || "Analysis unavailable.";
            
            let actAwaySc = ap.actual_away_score;
            let actHomeSc = ap.actual_home_score;
            let actWinner = ap.actual_winner || "N/A";
            
            html += `
            <div class="game-pane-card" style="margin-bottom: 24px;">
                <div class="game-pane-header-row">
                    <div class="header-time-info">
                        <span class="timestamp-badge">🗓 ${pg.local_time_display || 'Completed'}</span>
                        <span style="font-weight:900; font-size:16px; color:var(--primary);">FINAL: ${awayAbbr} ${actAwaySc} - ${homeAbbr} ${actHomeSc}</span>
                    </div>
                    <div class="header-center-logos">
                        <img src="${awayLogo}">
                        <span>${awayName} @ ${homeName}</span>
                        <img src="${homeLogo}">
                    </div>
                    <div class="header-market-box">
                        <span class="market-badge">${mLine}</span>
                        <span style="font-size:12px; font-weight:700;">Actual Winner: ${actWinner}</span>
                    </div>
                </div>

                <div class="matchup-overview-grid">
                    <div style="border-right: 1px solid var(--border); padding-right: 20px;">
                        <div class="comp-group-title">Pre-Game AI Thesis (Locked @ Kickoff)</div>
                        <div style="margin: 10px 0; font-weight: 800; font-size: 15px;">
                            🎯 Pre-Game Pick: <span style="color:var(--primary);">${pWinner}</span> 
                            <span class="confidence-badge">Conf: ${conf}/10</span>
                        </div>
                        <div style="font-weight:700; font-size:13px; margin-bottom:8px;">
                            Projected Implied: ${awayAbbr} ${estAway} - ${homeAbbr} ${estHome}
                        </div>
                        <p style="font-size: 13px; line-height: 1.5; color: var(--text); background: var(--toggle-bg); padding: 12px; border-radius: 8px;">
                            ${preAnalysis}
                        </p>
                    </div>

                    <div class="ai-script-card" style="background: var(--card);">
                        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:8px;">
                            <span style="font-weight:900; font-size:14px; text-transform:uppercase;">🩺 Post-Game Autopsy</span>
                            <div style="display:flex; align-items:center; gap:8px;">
                                <span class="confidence-badge">${correctTag}</span>
                                <span style="font-size:22px; font-weight:900; color:var(--primary);">Grade: ${grade}</span>
                            </div>
                        </div>
                        
                        <div style="font-size:12px; background:var(--toggle-bg); padding:10px; border-radius:8px; margin-top:4px;">
                            <div style="font-weight:800; margin-bottom:4px;">📊 Box Score Reality:</div>
                            <div>• Total Yards: ${awayAbbr} ${ap.away_yds || 'N/A'} | ${homeAbbr} ${ap.home_yds || 'N/A'}</div>
                            <div>• Turnovers: ${awayAbbr} ${ap.away_to || 0} | ${homeAbbr} ${ap.home_to || 0}</div>
                            <div style="color:var(--muted); font-size:11px; margin-top:2px;">• Leaders: ${ap.game_leaders || 'N/A'}</div>
                        </div>

                        <p style="font-size: 13.5px; line-height: 1.5; margin: 6px 0;">
                            ${ai_ap.autopsy_analysis || 'Autopsy analysis pending.'}
                        </p>

                        <div style="font-weight:800; font-size:12px; color:var(--primary); border-top:1px solid var(--border); padding-top:6px;">
                            💡 Takeaway: ${ai_ap.key_takeaway || ''}
                        </div>
                    </div>
                </div>
            </div>
            `;
        });

        if (html === "") {
            html = "<div class='game-pane-card' style='text-align:center; padding:50px;'><h2 style='color:var(--muted);'>No autopsies generated for this week yet.</h2></div>";
        }

        content.innerHTML = html;

        let winPct = totalCompleted > 0 ? ((correctPicks / totalCompleted) * 100).toFixed(1) : 0.0;
        let losses = totalCompleted - correctPicks;
        statsSpan.innerHTML = `${correctPicks}-${losses} (${winPct}%)`;
    }

    window.onload = initRecaps;
</script>
