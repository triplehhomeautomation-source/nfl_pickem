        --primary: #8b5cf6; --toggle-bg: #f3f4f6;
    }
    [data-theme="dark"] {
        --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #f8fafc; --muted: #94a3b8; 
        --primary: #a78bfa; --toggle-bg: #0f172a;
    }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
    .container { max-width: 1400px; margin: 0 auto; }
    .top-nav-bar { background: var(--card); padding: 14px 22px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 10px; z-index: 100; flex-wrap: wrap; gap: 16px; }
    .week-badge { background: var(--primary); color: white; padding: 10px 16px; border-radius: 8px; font-weight: 900; }
    select { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; min-width: 200px; }
    .btn-action { background: var(--toggle-bg); color: var(--text); border: 1px solid var(--border); padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; }
    .game-pane-card { background: var(--card); padding: 20px 24px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .game-pane-header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
    .header-center-logos { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 16px; }
    .header-center-logos img { width: 34px; height: 34px; object-fit: contain; }
    .header-market-box { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .market-badge { background: var(--toggle-bg); font-weight: 800; font-size: 13px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border); }
    .matchup-overview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .comp-group-title { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; border-bottom: 1px solid var(--border); padding-bottom: 3px; }
    .confidence-badge { font-size: 11px; font-weight: 800; padding: 3px 7px; border-radius: 6px; background: var(--toggle-bg); border: 1px solid var(--border); }
</style>
</head>

    function initRecaps() {
        const select = document.getElementById("history-week-select");

            let numA = parseInt(a.replace('Week_', '')) || 0;
            let numB = parseInt(b.replace('Week_', '')) || 0;
            return numB - numA;
        });

        weeks.forEach(w => {
            let opt = document.createElement("option");
            opt.value = w;
            opt.textContent = w.replace('_', ' ');
            select.appendChild(opt);
        });

        if (weeks.length > 0) {
            renderRecapView();
        } else {
            document.getElementById("recap-content-area").innerHTML = "<div class='game-pane-card' style='text-align:center; padding:50px;'><h2 style='color:var(--muted);'>No games have gone final yet. Check back after the first final whistle!</h2></div>";

                            <div style="display:flex; align-items:center; gap:8px;">
                                <span class="confidence-badge">${correctTag}</span>
                                <span style="font-size:22px; font-weight:900; color:var(--primary);">Grade: ${grade}</span>
                            </div>
                        </div>
                        
                        <div style="font-size:12px; background:var(--toggle-bg); padding:10px; border-radius:8px; margin-top:4px;">
                            <div style="font-weight:800; margin-bottom:4px;">📊 Box Score Reality:</div>
                            <div>• Total Yards: ${awayAbbr} ${ap.away_yds || 'N/A'} | ${homeAbbr} ${ap.home_yds || 'N/A'}</div>
                            <div>• Turnovers: ${awayAbbr} ${ap.away_to || 0} | ${homeAbbr} ${ap.home_to || 0}</div>
                            <div style="color:var(--muted); font-size:11px; margin-top:2px;">• Leaders: ${ap.game_leaders || 'N/A'}</div>
                        </div>

                        <p style="font-size: 13.5px; line-height: 1.5; margin: 6px 0;">
                            ${ai_ap.autopsy_analysis || 'Autopsy analysis pending.'}
                        </p>

                        <div style="font-weight:800; font-size:12px; color:var(--primary); border-top:1px solid var(--border); padding-top:6px;">
                            💡 Takeaway: ${ai_ap.key_takeaway || ''}
                        </div>
                    </div>
                </div>
            </div>
            `;
        });

        if (html === "") {
            html = "<div class='game-pane-card' style='text-align:center; padding:50px;'><h2 style='color:var(--muted);'>No autopsies generated for this week yet.</h2></div>";
        }

        content.innerHTML = html;

        let winPct = totalCompleted > 0 ? ((correctPicks / totalCompleted) * 100).toFixed(1) : 0.0;
        let losses = totalCompleted - correctPicks;
        statsSpan.innerHTML = `${correctPicks}-${losses} (${winPct}%)`;
    }

    window.onload = initRecaps;
</script>
</body>
</html>
